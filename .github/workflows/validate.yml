name: Validate dashboard

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: egm-performance/package-lock.json
      - name: Install locked application dependencies
        run: npm run install:app
      - name: Test dashboard and source collectors
        run: npm test
      - name: Verify protected runtime and build assets
        run: npm run build
