name: Validate and deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: egm-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: egm-performance/package-lock.json
      - name: Install locked application dependencies
        run: npm run install:app
      - name: Test dashboard and source collectors
        run: npm test
      - name: Verify protected runtime and build assets
        env:
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
        run: npm run build
      - name: Deploy existing Worker and bindings
        working-directory: egm-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ac23513945eb49f73a89faf1be12384e
        run: npx --yes wrangler@4.151.3 deploy
