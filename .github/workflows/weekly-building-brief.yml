name: Weekly building brief

on:
  schedule:
    - cron: '17 17 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-building-brief
  cancel-in-progress: false

jobs:
  brief:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
      - run: node --test scripts/weekly-building-brief.test.mjs
      - name: Collect evidence and upsert private review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/weekly-building-brief.mjs --publish
      - name: Retain evidence packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weekly-building-brief-${{ github.run_id }}
          path: weekly-brief-output/
          retention-days: 90
          if-no-files-found: ignore
